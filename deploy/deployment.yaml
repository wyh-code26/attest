apiVersion: apps/v1
kind: Deployment
metadata:
  name: attest-admission
  # 必须与 webhook.yaml 的 namespaceSelector 排除名单一致：
  # 本 Pod 自己也要过准入，webhook 未就绪时会被自己拦死（failurePolicy: Fail）。
  namespace: attest-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attest-admission
  template:
    metadata:
      labels:
        app: attest-admission
    spec:
      containers:
      - name: attest-admission
        image: attest-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8090
            scheme: HTTPS
          initialDelaySeconds: 2
          periodSeconds: 5
