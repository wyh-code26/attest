apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: attest-admission
webhooks:
  - name: attest.wyh-code26.github.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    clientConfig:
      service:
        name: attest-admission
        # 必须与 deployment.yaml / service.yaml 的实际命名空间一致。
        namespace: attest-system
        path: "/admission"
        port: 443
      # caBundle 刻意不写死在这里。
      #
      # 历史上这里硬编码了一段 base64 CA。结果是：凡是执行
      # `kubectl apply -f deploy/`，都会把 caBundle 覆盖回那次签发时的旧 CA。
      # 一旦 certs/ 重签过（镜像或 Secret 已经是新 CA），apiserver 就会报
      #   x509: certificate signed by unknown authority
      # 在 failurePolicy: Fail 下整个集群立刻无法创建 Pod。
      # 这个故障真实发生过两次，都是同一个时序问题：清单里的静态 caBundle
      # 从未与实际服务端证书同源。
      #
      # 现在由 hack/deploy-tls.sh 在创建 Secret 之后用 patch 注入，
      # 并回读指纹校验两者一致。apply 这个文件不会再把 caBundle 改回去。
      caBundle: ""
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
    # 用 namespaceSelector 而非 objectSelector 排除自身。
    #
    # 为什么改：原来的 objectSelector 写的是 app NotIn [attest-admission]，
    # 本意是放行 webhook 自己的 Pod，实际效果却是“任何打了这个 label 的 Pod 都不受检查”——
    # 只要能改 label 就能绕过整条准入链。改成按命名空间排除后，
    # 对象自身的 label 不再影响是否被检查。
    #
    # 注意：排除命名空间是必要的引导（bootstrap）例外，因为 attest 自身的 Pod
    # 也在本集群内创建，若它自己被拦（failurePolicy: Fail 且服务未就绪）就永远起不来。
    # 代价是该命名空间内其他 Pod 也不受检查，所以生产建议把 attest 单独放到
    # 一个专用命名空间（如 attest-system），而不是和业务共用一个。
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system", "kube-node-lease", "attest-system"]
