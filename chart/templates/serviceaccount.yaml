apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "attest.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "attest.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# 准入控制器不访问 K8s API 的业务资源，不需要挂载 token。
# 关掉自动挂载可以缩小被攻破后的横向移动面。
automountServiceAccountToken: false
